<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡Gracias por tu compra! — Fogón Mates</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F2EAD8; --brown-dark: #3A2419; --ember: #C4622D; --gold: #B8964E;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--cream); color: var(--brown-dark);
    font-family: 'Cormorant Garamond', serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 2rem;
  }
  .box { max-width: 480px; }
  h1 {
    font-family: 'Playfair Display', serif; font-size: 2.4rem; font-weight: 900;
    margin-bottom: 1rem; color: var(--brown-dark);
  }
  p { font-size: 1.15rem; line-height: 1.7; margin-bottom: 2rem; }
  .rule { width: 3rem; height: 1px; background: var(--gold); margin: 1.5rem auto; }
  a {
    display: inline-block; background: var(--ember); color: var(--cream);
    text-decoration: none; padding: 0.9rem 2rem; font-size: 0.9rem;
    letter-spacing: 0.15em; text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>¡Gracias por tu compra! 🤎</h1>
    <div class="rule"></div>
    <p>Recibimos tu pago. En breve te contactamos por WhatsApp para coordinar el envío de tu mate.</p>
    <a href="/index.html">Volver a la tienda</a>
  </div>
</body>
</html>
